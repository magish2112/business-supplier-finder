name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python test_app.py
        python test_link_display.py
        pytest tests/ -q

    - name: Run basic functionality test
      run: |
        python -c "
        from business_supplier_finder import BusinessSupplierFinder
        finder = BusinessSupplierFinder()
        print('✅ BusinessSupplierFinder initialized successfully')
        "

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run black --check
      run: black --check .

    - name: Run isort --check-only
      run: isort --check-only .

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Pyright
      uses: jakebailey/pyright-action@v1
      with:
        python-version: '3.10'
        args: --project pyrightconfig.json

    - name: Run Bandit
      run: bandit -r web_app.py routes app_db orchestration integrations -ll -q

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, security]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: supplier-finder:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm supplier-finder:latest python -c "print('Docker image works!')"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server
      run: |
        echo "🚀 Deploying to production server..."
        # Add your deployment commands here
        # Example: rsync, scp, docker push, etc.

  release:
    runs-on: ubuntu-latest
    needs: [test, lint, docker, deploy]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## What's Changed

          ### Features
          - Enhanced supplier search with AI integration
          - REST API endpoints for external integrations
          - Docker containerization
          - Improved caching system

          ### Bug Fixes
          - Fixed link display issues
          - Improved error handling
          - Enhanced logging

          ### Technical Improvements
          - Added type hints throughout codebase
          - Improved performance with async operations
          - Enhanced security measures

        draft: false
        prerelease: false
