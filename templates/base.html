<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Поиск бизнес-поставщиков{% endblock %}</title>
    
    <!-- Resource hints для производительности -->
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <!-- Прогресс-бар -->
    <div class="progress-container" id="progressContainer" style="display: none;">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}">
                <div class="me-3" style="width: 40px; height: 40px; background: var(--gradient-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-soft);">
                    <i class="fas fa-building text-white"></i>
                </div>
                <span style="background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; font-size: 1.25rem;">Бизнес-поставщики</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill position-relative" href="{{ url_for('index') }}">
                            <i class="fas fa-home me-2"></i>Главная
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary" style="font-size: 0.6em;">v2.0</span>
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill" href="{{ url_for('search') }}">
                            <i class="fas fa-search me-2"></i>Поиск
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill" href="{{ url_for('quick_search') }}">
                            <i class="fas fa-bolt me-2"></i>Быстрый поиск
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill" href="{{ url_for('search_progress') }}">
                            <i class="fas fa-tasks me-2"></i>Прогресс (демо)
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill" href="{{ url_for('saved_searches') }}">
                            <i class="fas fa-history me-2"></i>История
                        </a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link fw-semibold px-3 py-2 rounded-pill" href="{{ url_for('orchestration.flow_page') }}">
                            <i class="fas fa-diagram-project me-2"></i>Оркестрация
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center text-white py-4 mt-5">
        <div class="container">
            <p class="mb-0">
                <i class="fas fa-code me-2"></i>
                Поиск бизнес-поставщиков строительных материалов
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS с оптимизацией загрузки -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous" defer></script>

    <script src="{{ url_for('static', filename='js/app_shell.js') }}" defer></script>

    <script src="{{ url_for('static', filename='js/bizsf_api.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
