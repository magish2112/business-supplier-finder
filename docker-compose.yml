version: '3.8'

services:
  supplier-finder:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - SECRET_KEY=change_this_in_production
      - PERPLEXITY_ENABLED=false
      # С профилем with-redis раскомментируйте (хост сервиса redis):
      # - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опционально: Redis для кэширования
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  redis_data:

networks:
  default:
    driver: bridge
